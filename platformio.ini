[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = cmsis
upload_protocol = serial
monitor_speed = 115200

build_unflags =
    -mfloat-abi=hard
    -mfloat-abi=soft
    -mfpu=fpv4-sp-d16
    -mfpu=fpv5-sp-d16

build_flags =
    -mcpu=cortex-m4
    -mthumb
    -mfloat-abi=softfp
    -mfpu=fpv4-sp-d16
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Iinclude
    -Ilib/FreeRTOS-Kernel/include
    -Ilib/FreeRTOS-Kernel/portable/GCC/ARM_CM4F
    -Isrc

link_flags =
    -mcpu=cortex-m4
    -mthumb
    -mfloat-abi=softfp
    -mfpu=fpv4-sp-d16